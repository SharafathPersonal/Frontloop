<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#047857" />
    <title>Offline | FrontLoop</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: #0B1120;
        color: #F8FAFC;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      main { max-width: 420px; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 28px; margin: 24px 0 12px; }
      p { color: #94A3B8; font-size: 15px; line-height: 1.6; margin: 0 0 28px; }
      button {
        background: #047857;
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 14px 28px;
        font: inherit;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover { background: #065F46; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="FrontLoop" />
      <h1>You&rsquo;re offline</h1>
      <p>FrontLoop needs a connection to load your leads and conversations. Your AI front desk keeps replying to customers on WhatsApp in the meantime.</p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', function () { location.reload(); });
    </script>
  </body>
</html>
